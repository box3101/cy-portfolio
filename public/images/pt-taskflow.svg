<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="white"/>
  <!-- 플로우 노드 -->
  <g transform="translate(70, 60)">
    <!-- 완료 노드 -->
    <rect x="0" y="8" width="48" height="48" rx="12" fill="#3b82f6"/>
    <polyline points="14,32 22,40 36,24" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 연결선 -->
    <line x1="48" y1="32" x2="62" y2="32" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="5 4"/>
    <!-- 진행중 노드 -->
    <rect x="62" y="8" width="48" height="48" rx="12" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="74" y="20" width="24" height="24" rx="6" fill="#bfdbfe"/>
    <!-- 아래 연결 -->
    <line x1="86" y1="56" x2="86" y2="70" stroke="#93c5fd" stroke-width="2.5" stroke-dasharray="5 4"/>
    <!-- 대기 노드 -->
    <rect x="62" y="70" width="48" height="48" rx="12" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  </g>
  <!-- 타이포 -->
  <text x="210" y="100" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-2" fill="#0f172a">Task</text>
  <text x="210" y="152" font-family="'Segoe UI', system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-2" fill="#3b82f6">Flow</text>
  <!-- 하단 디테일 -->
  <line x1="70" y1="180" x2="350" y2="180" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="70" y="198" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#94a3b8">PROJECT MANAGEMENT</text>
</svg>
