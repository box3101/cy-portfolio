<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <rect width="400" height="240" fill="white"/>
  <!-- 차트 바 그래프 -->
  <g transform="translate(75, 50)">
    <rect x="0" y="80" width="22" height="60" rx="4" fill="#fbbf24"/>
    <rect x="30" y="50" width="22" height="90" rx="4" fill="#f97316"/>
    <rect x="60" y="20" width="22" height="120" rx="4" fill="#ef4444"/>
    <rect x="90" y="40" width="22" height="100" rx="4" fill="#f97316"/>
    <rect x="120" y="70" width="22" height="70" rx="4" fill="#fbbf24"/>
    <!-- 트렌드 라인 -->
    <polyline points="11,75 41,45 71,15 101,35 131,65" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="71" cy="15" r="4" fill="#1e293b"/>
  </g>
  <!-- 타이포 -->
  <text x="230" y="95" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-1" fill="#1e293b">BOX</text>
  <text x="230" y="138" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" letter-spacing="-1" fill="#ef4444">OFFICE</text>
  <!-- 하단 디테일 -->
  <line x1="75" y1="180" x2="340" y2="180" stroke="#fee2e2" stroke-width="1.5"/>
  <text x="75" y="198" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="500" letter-spacing="4" fill="#94a3b8">DATA DASHBOARD</text>
</svg>
